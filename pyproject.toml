[project]
name = "student-complaint-system"
version = "1.0.0"
description = "Production-Ready Student Complaint Management System Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "gunicorn>=22.0.0",
    "sqlalchemy[asyncio]>=2.0.31",
    "alembic>=1.13.2",
    "pydantic-settings>=2.3.4",
    "pydantic[email]>=2.7.4",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.7",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.2",
    "boto3>=1.34.135",
    "types-python-jose>=3.3.4.20240106",
    "types-passlib>=1.7.7.20240327",
    "types-redis>=4.6.0.20240417",
    "types-boto3>=1.34.135"
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.1",
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0"
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (python 3+ upgrades)
]
ignore = ["B008", "E501", "E712", "C901", "B904"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = [
    "app.api.v1.*",
    "app.api.deps",
    "app.models.*",
    "app.schemas.*",
    "app.services.*",
    "app.database",
    "seed",
    "test_api"
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "passlib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
