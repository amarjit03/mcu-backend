name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        version: "latest"
        
    - name: Install dependencies
      run: uv sync
        
    - name: Run Ruff Linter
      run: uv run ruff check app/ tests/
      
    - name: Run MyPy Type Checks
      run: uv run mypy app/ tests/
        
    - name: Run Database Migrations (SQLite Test DB)
      run: |
        echo "PROJECT_NAME=\"Test Student Complaint System\"" > .env
        echo "ENV=test" >> .env
        echo "DEBUG=True" >> .env
        echo "DATABASE_URL=sqlite:///./test.db" >> .env
        echo "SECRET_KEY=7ba72f4e0c7a52fbd1e712a768d4a9d70deef5f6a61eb3d1544a0378e9185a3c" >> .env
        echo "ALGORITHM=HS256" >> .env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> .env
        echo "REFRESH_TOKEN_EXPIRE_DAYS=7" >> .env
        echo "UPLOAD_DIR=uploads" >> .env
        echo "MAX_UPLOAD_SIZE_MB=10" >> .env
        uv run alembic upgrade head
        
    - name: Run Pytest Suite
      run: uv run pytest
